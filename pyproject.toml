[project]
name = "binja-codemode-mcp"
version = "0.2.0"
description = "MCP server for LLM-assisted reverse engineering via code execution in Binary Ninja"
requires-python = ">=3.10"
# No runtime dependencies, by design. Binary Ninja's bundled Python 3.10 ships a
# complete stdlib; the plugin must never need pip at load time.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.64",
    "tomli>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
# Never reflow Markdown. guide.md is a product surface the model reads and is
# hand-wrapped on purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ty.environment]
python-version = "3.10"
# Binary Ninja's API is not pip-installable, so read it from the app bundle.
# `src` is here because the package is not installed into the venv.
extra-paths = [
    "src",
    "/Applications/Binary Ninja.app/Contents/Resources/python",
    "/Applications/Binary Ninja.app/Contents/Resources/python3",
]

# Editor-only. basedpyright is not a gate and not a project dependency — `make
# test` type-checks with ty. This block exists so an editor's language server
# resolves the same imports ty does, instead of reporting the package and the
# Binary Ninja API as missing.
[tool.basedpyright]
pythonVersion = "3.10"
# basedpyright defaults to a much stricter mode than pyright; `standard` keeps
# the editor's diagnostics close to what ty reports in the terminal.
typeCheckingMode = "standard"
# Two of basedpyright's stricter rules earn their keep; the rest of its
# `recommended` set is noise here, since `bv` is deliberately untyped.
reportPrivateUsage = "warning"
reportMissingTypeArgument = "warning"
include = ["src", "tests"]
extraPaths = [
    "src",
    "/Applications/Binary Ninja.app/Contents/Resources/python",
    "/Applications/Binary Ninja.app/Contents/Resources/python3",
]
